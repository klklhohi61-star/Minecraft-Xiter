services:
  - type: web
    name: minecraft-xiter-bot
    runtime: node
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_HOST
        value: villainsmpknowledge.falixsrv.me
      - key: BOT_PORT
        value: "20013"
      - key: BOT_USERNAME
        value: XiterBot
      - key: MC_VERSION
        value: "1.20.1"
      - key: BOT_AUTH
        value: offline
      - key: RECONNECT_DELAY
        value: "10000"
      - key: AFK_INTERVAL
        value: "30000"
      - key: CHAT_PREFIX
        value: "!"
      - key: OWNER_USERNAME
        sync: false          # your in-game username for !stop / !reconnect
